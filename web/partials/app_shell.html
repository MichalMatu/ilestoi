    <!-- App menu -->
    <div class="app-menu" id="app-menu">
        <button type="button" class="app-menu-button" id="app-menu-toggle"
            data-i18n-attr="title:appMenu.open;aria-label:appMenu.open" title="Otwórz menu"
            aria-label="Otwórz menu" aria-controls="app-menu-drawer" aria-expanded="false"
            onclick="toggleAppMenu()">
            <svg class="app-menu-icon app-menu-icon--open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z" />
            </svg>
            <svg class="app-menu-icon app-menu-icon--close" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" />
            </svg>
        </button>
    </div>
    <button class="app-menu-scrim" id="app-menu-scrim" type="button" tabindex="-1" aria-hidden="true" hidden
        data-i18n-attr="aria-label:appMenu.close" aria-label="Zamknij menu" onclick="closeAppMenu()"></button>
    <aside class="app-menu-drawer" id="app-menu-drawer" hidden aria-label="Menu aplikacji"
        data-i18n-attr="aria-label:appMenu.label">
        <div class="app-menu-drawer-header">
            <div class="app-menu-title-wrap">
                <button type="button" class="app-menu-brand" id="app-menu-title" onclick="closeAppMenu()">IleStoi.pl</button>
            </div>
        </div>

        <div class="app-menu-drawer-scroll" id="app-menu-drawer-scroll">
        <section class="app-menu-map-panel" aria-label="Kontrolki mapy"
            data-i18n-attr="aria-label:panel.mapControls">
            <button type="button" class="panel-photo-cta" id="panel-add-field-photo"
                data-i18n-attr="title:panel.addPhotoTitle" title="Wskaż miejsce zdjęcia na mapie"
                aria-pressed="false" onclick="openFieldPhotoUploadFromPanel()" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M5 7h2.8L9.4 5h5.2l1.6 2H19c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2zm7 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0-2a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" />
                </svg>
                <span data-panel-add-photo-label data-i18n="panel.addPhoto">Dodaj zdjęcie</span>
            </button>

            <section class="panel-section panel-layers">
                <div id="map-layer-controls" class="map-layer-controls is-loading-public-layers" aria-label="Warstwy mapy"
                    data-i18n-attr="aria-label:layers.label">
                    <h3 class="app-menu-group-title" data-i18n="layers.reportsGroup">Zgłoszenia</h3>
                    <div class="layer-toggle layer-toggle--vehicle">
                        <label class="layer-toggle-row">
                            <input type="checkbox" id="toggle-vehicles" checked
                                onchange="toggleVehicleLayer(this.checked)">
                            <span class="layer-pin layer-pin--vehicle"></span>
                            <span class="layer-label" data-i18n="layers.vehicles">Pojazdy</span>
                            <span class="layer-count-badge" id="layer-count-vehicles">0</span>
                        </label>
                        <div class="vehicle-filter-choice-grid" role="group"
                            aria-label="Filtry pojazdów" data-i18n-attr="aria-label:layers.vehicleFilters">
                                <label><span data-i18n="layers.vehicleInsuranceFull">Ubezpieczenie OC</span>
                                    <select id="vehicle-insurance-select" onchange="setVehicleInsuranceFilter(this.value)">
                                        <option value="all" data-i18n="layers.vehicleFilterAll">Wszystkie</option>
                                        <option value="insured" data-i18n="layers.vehicleFilterInsured">Ubezpieczone</option>
                                        <option value="uninsured" data-i18n="layers.vehicleFilterUninsured">Bez OC</option>
                                        <option value="unknown" data-i18n="layers.vehicleFilterUnknown">Nieznane</option>
                                    </select>
                                </label>
                                <label><span data-i18n="layers.vehicleStandingFull">Czas postoju</span>
                                    <select id="vehicle-standing-select" onchange="setVehicleStandingFilterDays(Number(this.value))">
                                        <option value="0" data-i18n="layers.vehicleFilterAll">Wszystkie</option>
                                        <option value="30" data-i18n="layers.vehicleFilter30">Od 30 dni</option>
                                        <option value="60" data-i18n="layers.vehicleFilter60">Od 60 dni</option>
                                        <option value="90" data-i18n="layers.vehicleFilter90">Od 90 dni</option>
                                    </select>
                                </label>
                                <label><span data-i18n="layers.vehiclePhotosFull">Liczba zdjęć</span>
                                    <select id="vehicle-photo-select" onchange="setVehiclePhotoFilter(this.value)">
                                        <option value="off" data-i18n="layers.vehicleFilterAll">Wszystkie</option>
                                        <option value="up_to_6" data-i18n="layers.vehicleFilterUpTo6">Do 6 zdjęć</option>
                                        <option value="above_6" data-i18n="layers.vehicleFilterAbove6">7 i więcej</option>
                                    </select>
                                </label>
                                <label><span data-i18n="layers.vehicleRemovedFull">Status pojazdu</span>
                                    <select id="vehicle-resolution-select" onchange="setVehicleResolutionFilter(this.value)">
                                        <option value="active" data-i18n="layers.vehicleFilterActive">Widoczne</option>
                                        <option value="all" data-i18n="layers.vehicleFilterAll">Wszystkie</option>
                                        <option value="removed" data-i18n="layers.vehicleFilterRemoved">Usunięte</option>
                                    </select>
                                </label>
                        </div>
                    </div>
                    <label class="layer-toggle">
                        <input type="checkbox" id="toggle-field-photo-infrastructure" checked
                            onchange="toggleFieldPhotoIssueFilter('infrastructure', this.checked)">
                        <span class="layer-pin layer-pin--field-photo-infrastructure"></span>
                        <span class="layer-label" data-i18n="layers.fieldPhotoInfrastructure">Infrastruktura</span>
                        <span class="layer-count-badge" id="layer-count-field-photo-infrastructure">0</span>
                    </label>
                    <label class="layer-toggle">
                        <input type="checkbox" id="toggle-field-photo-smoke" checked
                            onchange="toggleFieldPhotoIssueFilter('smoke', this.checked)">
                        <span class="layer-pin layer-pin--field-photo-smoke"></span>
                        <span class="layer-label" data-i18n="layers.fieldPhotoSmoke">Powietrze</span>
                        <span class="layer-count-badge" id="layer-count-field-photo-smoke">0</span>
                    </label>
                    <label class="layer-toggle">
                        <input type="checkbox" id="toggle-field-photo-pending" checked
                            onchange="togglePendingFieldPhotoLayer(this.checked)">
                        <span class="layer-pin layer-pin--field-photo-pending"></span>
                        <span class="layer-label" data-i18n="layers.fieldPhotoPending">Do weryfikacji</span>
                        <span class="layer-count-badge" id="layer-count-field-photo-pending">0</span>
                    </label>
                    <h3 class="app-menu-group-title" data-i18n="layers.appearanceGroup">Wygląd mapy</h3>
                    <label class="layer-toggle panel-map-source" id="panel-map-source"
                        data-i18n-attr="title:panel.baseMapSliderToggle"
                        title="Pokaż wybór podkładu mapy">
                        <input type="checkbox" id="map-source-slider-toggle"
                            data-i18n-attr="aria-label:panel.baseMapSliderToggle"
                            aria-label="Pokaż wybór podkładu mapy" onchange="setMapSourceSliderVisible(this.checked)" checked>
                        <span class="layer-pin layer-pin--base-map-osm"></span>
                        <span class="layer-label" data-i18n="panel.baseMap">Pokaż wybór podkładu</span>
                        <span class="layer-count-badge" id="map-source-current-badge">POL</span>
                    </label>
                    <label class="layer-toggle" data-i18n-attr="title:layers.cadastralTooltip">
                        <input type="checkbox" id="toggle-cadastral-parcels"
                            onchange="toggleCadastralLayer(this.checked)">
                        <span class="layer-pin layer-pin--cadastral"></span>
                        <span class="layer-label" data-i18n="layers.cadastral">Granice działek</span>
                    </label>
                    <label class="layer-toggle" data-i18n-attr="title:layers.streetLabelsTooltip"
                        title="Nazwy ulic na ortofotomapie (mapa OSM ma własne etykiety)">
                        <input type="checkbox" id="toggle-street-labels" checked
                            onchange="toggleMapLabelLayer(this.checked)">
                        <span class="layer-pin layer-pin--street-labels" aria-hidden="true">Aa</span>
                        <span class="layer-label" data-i18n="layers.streetLabels">Nazwy ulic</span>
                        <span class="layer-unavailable-note" id="street-labels-unavailable"
                            data-i18n="layers.streetLabelsUnavailable" hidden>OSM ma własne nazwy</span>
                    </label>
                </div>
            </section>
        </section>

        <nav class="app-menu-drawer-section" aria-label="Menu aplikacji"
            data-i18n-attr="aria-label:appMenu.label">
            <button type="button" class="app-menu-drawer-item" onclick="openParkingCostsModal(); closeAppMenu()">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 3h10v2h2v16h-2v-4H7v4H5V5h2V3zm2 2v4h6V5H9zm-2 6v4h10v-4H7zm2 1h2v2H9v-2zm4 0h2v2h-2v-2z" />
                </svg>
                <span data-i18n="modal.parkingCosts.menu">Koszty postoju</span>
            </button>
        </nav>
        </div>
        <div class="app-menu-drawer-footer">
            <div class="app-menu-footer-actions">
                <button type="button" class="app-menu-footer-icon app-menu-footer-icon--settings"
                    data-i18n-attr="title:icon.settings;aria-label:icon.settings"
                    title="Ustawienia" aria-label="Ustawienia" onclick="openSettingsModal(); closeAppMenu()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.14 12.94c.04-.31.06-.62.06-.94 0-.32-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96a7.026 7.026 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84a.484.484 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.07.49.12.61l2.03 1.58c-.04.31-.07.62-.07.94 0 .32.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .43-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                    </svg>
                </button>
                <button type="button" class="app-menu-footer-icon app-menu-footer-icon--lang btn-lang" id="app-menu-toggle-lang"
                    data-i18n-attr="title:icon.lang;aria-label:icon.lang"
                    title="Język / Language" aria-label="Język / Language" onclick="toggleLang()">
                    <span class="lang-label" id="app-menu-lang-label">PL</span>
                </button>
                <button type="button" class="app-menu-footer-icon app-menu-footer-icon--admin" id="open-admin-panel"
                    data-i18n-attr="title:icon.adminPanel;aria-label:icon.adminPanel"
                    title="Panel administratora" aria-label="Panel administratora"
                    onclick="openAdminPanel(); closeAppMenu()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M17 9V7A5 5 0 0 0 7 7v2H5v12h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9zm5 8h-2v-4h2v4z" />
                    </svg>
                </button>
            </div>
            <div class="app-menu-footer-links">
                <button type="button" class="app-menu-footer-link" id="app-menu-open-tour"
                    onclick="closeAppMenu({ restoreFocus: false }); startOnboardingTour()"
                    data-i18n="tour.reopen">Samouczek</button>
                <button type="button" class="app-menu-footer-link"
                    onclick="openModal('modal-privacy-info'); closeAppMenu()"
                    data-i18n="footer.privacy">Prywatność</button>
                <button type="button" class="app-menu-footer-link" onclick="openProblemReportModal(); closeAppMenu()"
                    data-i18n="footer.report">Zgłoś problem</button>
            </div>
        </div>
    </aside>

    <div id="status" class="global-status-toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Interactive Map -->
    <main id="map" tabindex="0" aria-label="Interaktywna mapa"
        data-i18n-attr="aria-label:map.label"></main>
    <div id="map-field-photo-pick-hint" class="map-pick-hint" role="status" aria-live="polite"
        aria-atomic="true" hidden>
        <span class="map-pick-hint-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 2 5 5v6c0 4.7 3 8.8 7 10 4-1.2 7-5.3 7-10V5l-7-3zm0 3.1 4 1.5V11c0 3-1.6 5.8-4 7-2.4-1.2-4-4-4-7V6.6l4-1.5zm0 3.4a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />
            </svg>
        </span>
        <span data-map-pick-hint-label data-i18n="panel.addPhotoPickStatus">Wybierz punkt · Enter: środek · Esc: anuluj</span>
        <button type="button" class="map-pick-hint-close"
            data-i18n-attr="title:panel.addPhotoPickCancel;aria-label:panel.addPhotoPickCancel"
            title="Anuluj wybór miejsca" aria-label="Anuluj wybór miejsca"
            onclick="cancelFieldPhotoLocationPick({ announce: true, restoreFocus: true })">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4-6.3-6.3-6.3 6.3-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3 1.4 1.4z" />
            </svg>
        </button>
    </div>

    <!-- Map source slider -->
    <div id="year-slider">
        <button type="button" class="year-arrow" id="year-prev" title="Poprzedni podkład"
            aria-label="Poprzedni podkład"
            data-i18n-attr="title:panel.baseMapPrevious;aria-label:panel.baseMapPrevious">◀</button>
        <div class="year-track">
            <input type="range" id="year-range" min="0" max="7" step="1" value="7"
                aria-label="Wybierz podkład mapy" data-i18n-attr="aria-label:panel.baseMapSlider">
            <div class="year-ticks" id="year-ticks"></div>
        </div>
        <button type="button" class="year-arrow" id="year-next" title="Następny podkład"
            aria-label="Następny podkład"
            data-i18n-attr="title:panel.baseMapNext;aria-label:panel.baseMapNext">▶</button>
        <div class="year-current" id="year-current" aria-live="polite" aria-atomic="true">POL</div>
    </div>

    <!-- Map right-click menu -->
    <div id="map-context-menu" class="map-context-menu" role="menu" aria-label="Menu punktu mapy"
        data-i18n-attr="aria-label:context.menuLabel" hidden>
        <button type="button" class="context-menu-coords" id="context-menu-coords" role="menuitem"
            data-i18n-attr="title:context.copyCoords;aria-label:context.copyCoords"
            title="Kopiuj współrzędne" aria-label="Kopiuj współrzędne" onclick="copyContextCoords()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
            </svg>
            <span class="context-menu-coords-value" id="context-menu-coords-value"></span>
        </button>
        <button type="button" id="context-add-field-photos" role="menuitem"
            onclick="openFieldPhotoUploadAtContextPoint()" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M5 7h2.8L9.4 5h5.2l1.6 2H19c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2zm7 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm5-5h-2v2h-2v2h2v2h2v-2h2v-2h-2v-2z" />
            </svg>
            <span data-i18n="context.addFieldPhotos">Dodaj zdjęcia tutaj</span>
        </button>
        <button type="button" id="context-inspect-location" role="menuitem" onclick="openLocationInspectionAtContextPoint()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M4 5h16v2H4V5zm1 4h4v10H5V9zm5 0h4v10h-4V9zm5 0h4v10h-4V9zM3 20h18v2H3v-2z" />
            </svg>
            <span data-i18n="context.inspectLocation">Pokaż historię miejsca</span>
        </button>
        <button type="button" id="context-show-address" role="menuitem" onclick="showAddressAtContextPoint()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z" />
            </svg>
            <span data-i18n="context.showAddress">Pokaż adres</span>
        </button>
        <button type="button" id="context-identify-parcel" role="menuitem"
            onclick="identifyCadastralParcelAtContextPoint()" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M4 4h16v16H4V4zm2 2v5h5V6H6zm7 0v5h5V6h-5zM6 13v5h5v-5H6zm7 0v5h5v-5h-5z" />
            </svg>
            <span data-i18n="context.identifyParcel">Sprawdź działkę</span>
        </button>
        <button type="button" role="menuitem" onclick="copyContextPlaceLink()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M3.9 12a5 5 0 0 1 5-5h4v2h-4a3 3 0 0 0 0 6h4v2h-4a5 5 0 0 1-5-5zm5.1 1h6v-2H9v2zm2-6h4a5 5 0 0 1 0 10h-4v-2h4a3 3 0 0 0 0-6h-4V7z" />
            </svg>
            <span data-i18n="context.copyPlaceLink">Skopiuj link do miejsca</span>
        </button>
    </div>

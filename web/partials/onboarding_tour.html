<!-- Guided tour: no forms or reporting actions are triggered by the tour. -->
<section id="onboarding-tour" class="onboarding-tour" hidden aria-labelledby="onboarding-tour-title"
    aria-describedby="onboarding-tour-description" role="dialog" aria-modal="true">
    <div class="onboarding-tour-shield" aria-hidden="true"></div>
    <div class="onboarding-tour-spotlight" aria-hidden="true" hidden></div>
    <div class="onboarding-tour-card" tabindex="-1">
        <div class="onboarding-tour-progress" id="onboarding-tour-progress" aria-live="polite"></div>
        <h2 id="onboarding-tour-title"></h2>
        <p id="onboarding-tour-description"></p>
        <div class="onboarding-tour-actions">
            <button type="button" class="onboarding-tour-skip" id="onboarding-tour-skip"></button>
            <div class="onboarding-tour-nav">
                <button type="button" class="onboarding-tour-back" id="onboarding-tour-back"></button>
                <button type="button" class="onboarding-tour-next" id="onboarding-tour-next"></button>
            </div>
        </div>
    </div>
</section>
